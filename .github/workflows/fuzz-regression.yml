name: Fuzz regression

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz-regression.yml"
  push:
    branches: [main]

jobs:
  fuzz-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [boc_parser, tvm_execution, block_header]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} --manifest-path fuzz/Cargo.toml -- -runs=10000
