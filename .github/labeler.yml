crates:
  - changed-files:
      - any-glob-to-any-file: 'crates/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**.md'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

workspace:
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
