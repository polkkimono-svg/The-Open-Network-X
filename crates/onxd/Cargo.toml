[package]
name = "onxd"
version = "0.1.0"
edition = "2021"
description = "ONX node daemon bootstrap: config parsing, role selection, storage, consensus, execution, networking, and transaction routing summary."
license = "Apache-2.0"
publish = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
onx-telemetry = { path = "../onx-telemetry" }

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
